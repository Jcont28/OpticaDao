<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand">Óptica | Inventario</span><a class="nav-link text-white" href="ventas.html">Ventas</a><a class="nav-link text-white" href="historial.html">Mediciones</a></div></nav><main class="container py-4"><h2>Gestión de inventario</h2><div class="alert alert-warning" id="alertas">Cargando alertas…</div><form id="form" class="card card-body mb-4"><input type="hidden" id="id"><div class="row g-2"><div class="col-md-3"><input id="nombre" class="form-control" placeholder="Nombre" required></div><div class="col-md-2"><select id="tipo" class="form-select"><option>ARO</option><option>LUNA</option><option>ACCESORIO</option></select></div><div class="col-md-2"><input id="marca" class="form-control" placeholder="Marca"></div><div class="col-md-2"><input id="material" class="form-control" placeholder="Material"></div><div class="col-md-2"><input id="forma" class="form-control" placeholder="Forma"></div><div class="col-md-2"><input id="precio" class="form-control" type="number" min="0" step=".01" placeholder="Precio" required></div><div class="col-md-2"><input id="stock" class="form-control" type="number" min="0" placeholder="Stock" required></div><div class="col-md-2"><button class="btn btn-primary w-100">Guardar</button></div></div></form><table class="table table-striped"><thead><tr><th>Producto</th><th>Tipo</th><th>Marca</th><th>Material</th><th>Forma</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const $=id=>document.getElementById(id);let data=[];
async function cargar(){let r=await fetch('api/productos');data=await r.json();$('rows').innerHTML='';let low=data.filter(x=>x.tipo==='ARO'&&x.stock<5);$('alertas').textContent=low.length?'Stock bajo: '+low.map(x=>x.nombre+' ('+x.stock+')').join(', '):'No hay alertas de stock bajo.';data.forEach(x=>{$('rows').insertAdjacentHTML('beforeend',`<tr><td>${x.nombre}</td><td>${x.tipo}</td><td>${x.marca||''}</td><td>${x.material||''}</td><td>${x.forma||''}</td><td>${x.precio}</td><td>${x.stock}</td><td><button class="btn btn-sm btn-warning" onclick="editar(${x.id})">Editar</button> <button class="btn btn-sm btn-danger" onclick="borrar(${x.id})">Desactivar</button></td></tr>`)});}
function editar(id){let x=data.find(p=>p.id===id);['id','nombre','tipo','marca','material','forma','precio','stock'].forEach(k=>$(k).value=x[k]??'');}
$('form').onsubmit=async e=>{e.preventDefault();let x={nombre:$('nombre').value,tipo:$('tipo').value,marca:$('marca').value,material:$('material').value,forma:$('forma').value,precio:$('precio').value,stock:+$('stock').value};let edit=!!$('id').value;if(edit)x.id=+$('id').value;let r=await fetch('api/productos',{method:edit?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});let d=await r.json();alert(d.mensaje);if(r.ok){$('form').reset();$('id').value='';cargar();}};
async function borrar(id){if(confirm('¿Desactivar producto?')){let r=await fetch('api/productos?id='+id,{method:'DELETE'});alert((await r.json()).mensaje);cargar();}}cargar();
</script></body></html>
