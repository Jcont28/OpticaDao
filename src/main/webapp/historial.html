<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis mediciones</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><h2>Historial de mediciones</h2><p>Consulta tus recetas oftalmológicas registradas.</p><table class="table table-striped"><thead><tr><th>Fecha</th><th>Ojo</th><th>Esfera</th><th>Cilindro</th><th>Eje</th><th>Adición</th><th>Observaciones</th></tr></thead><tbody id="rows"></tbody></table><a href="catalogo.html">Volver al catálogo</a></main><script>
(async()=>{let r=await fetch('api/mediciones');let a=await r.json();rows.innerHTML=a.map(x=>`<tr><td>${String(x.Fecha).substring(0,10)}</td><td>${x.Ojo}</td><td>${x.Esfera}</td><td>${x.Cilindro}</td><td>${x.Eje}</td><td>${x.Adicion}</td><td>${x.Observaciones||''}</td></tr>`).join('')||'<tr><td colspan="7">No hay mediciones registradas.</td></tr>';})();
</script></body></html>
