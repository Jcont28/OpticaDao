<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mediciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Óptica | Vendedor</span>
            <div class="navbar-nav">
                <a class="nav-link" href="productos.html">Inventario</a>
                <a class="nav-link active" href="mediciones.html">Mediciones</a>
                <a class="nav-link" href="ventas.html">Ventas</a>
            </div>
            <div class="text-white">
                <span id="nombreUsuario"></span>
                <button class="btn btn-sm btn-outline-light ms-2" onclick="salir()">Salir</button>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        <h2>Mediciones de clientes</h2>
        <div id="mensaje" class="d-none"></div>
        <label class="form-label" for="cliente">Cliente</label>
        <select id="cliente" class="form-select mb-3" style="max-width: 400px"></select>

        <form id="formMedicion" class="card card-body mb-4">
            <h5>Nueva medición</h5>
            <div class="row g-2">
                <div class="col-12 fw-bold">Ojo derecho (OD)</div>
                <div class="col-md-4"><input id="esferaOd" class="form-control" type="number" step="0.25" placeholder="Esfera" required></div>
                <div class="col-md-4"><input id="cilindroOd" class="form-control" type="number" step="0.25" placeholder="Cilindro" value="0"></div>
                <div class="col-md-4"><input id="ejeOd" class="form-control" type="number" min="0" max="180" placeholder="Eje" value="0"></div>
                <div class="col-12 fw-bold">Ojo izquierdo (OI)</div>
                <div class="col-md-4"><input id="esferaOi" class="form-control" type="number" step="0.25" placeholder="Esfera" required></div>
                <div class="col-md-4"><input id="cilindroOi" class="form-control" type="number" step="0.25" placeholder="Cilindro" value="0"></div>
                <div class="col-md-4"><input id="ejeOi" class="form-control" type="number" min="0" max="180" placeholder="Eje" value="0"></div>
                <div class="col-md-3"><label class="form-label">Adición</label><input id="adicion" class="form-control" type="number" step="0.25" min="0" value="0"></div>
                <div class="col-md-3"><label class="form-label">Distancia pupilar</label><input id="distanciaPupilar" class="form-control" type="number" step="0.5" min="0" value="0"></div>
                <div class="col-md-6"><label class="form-label">Observaciones</label><input id="observaciones" class="form-control"></div>
                <div class="col-md-3"><button class="btn btn-primary w-100">Guardar medición</button></div>
            </div>
        </form>

        <table class="table table-striped table-bordered text-center">
            <thead>
                <tr><th>Fecha</th><th>OD Esf</th><th>OD Cil</th><th>OD Eje</th><th>OI Esf</th><th>OI Cil</th><th>OI Eje</th><th>Add</th><th>DP</th><th>Observaciones</th></tr>
            </thead>
            <tbody id="filas"></tbody>
        </table>
    </main>
    <script src="js/app.js"></script>
    <script>
        const campos = ['esferaOd', 'cilindroOd', 'ejeOd', 'esferaOi', 'cilindroOi', 'ejeOi', 'adicion', 'distanciaPupilar', 'observaciones'];

        async function cargarClientes() {
            try {
                const clientes = await pedir('api/clientes');
                llenarSelect('cliente', clientes, function (c) { return c.nombre + ' - ' + c.dni; });
            } catch (error) {
                mostrarMensaje('mensaje', error.message, 'danger');
            }
        }

        async function cargarMediciones() {
            const clienteId = document.getElementById('cliente').value;
            const tabla = document.getElementById('filas');
            if (!clienteId) {
                tabla.innerHTML = '<tr><td colspan="10">Seleccione un cliente.</td></tr>';
                return;
            }
            try {
                const lista = await pedir('api/mediciones?clienteId=' + clienteId);
                let html = '';
                for (const m of lista) {
                    html += '<tr><td>' + m.fecha + '</td><td>' + m.esferaOd + '</td><td>' + m.cilindroOd + '</td><td>' + m.ejeOd + '</td>'
                        + '<td>' + m.esferaOi + '</td><td>' + m.cilindroOi + '</td><td>' + m.ejeOi + '</td>'
                        + '<td>' + m.adicion + '</td><td>' + m.distanciaPupilar + '</td><td>' + escapar(m.observaciones) + '</td></tr>';
                }
                if (lista.length === 0) {
                    html = '<tr><td colspan="10">El cliente no tiene mediciones.</td></tr>';
                }
                tabla.innerHTML = html;
            } catch (error) {
                mostrarMensaje('mensaje', error.message, 'danger');
            }
        }

        document.getElementById('cliente').addEventListener('change', cargarMediciones);

        document.getElementById('formMedicion').addEventListener('submit', async function (e) {
            e.preventDefault();
            const clienteId = document.getElementById('cliente').value;
            if (!clienteId) {
                mostrarMensaje('mensaje', 'Seleccione un cliente', 'warning');
                return;
            }
            const medicion = { clienteId: clienteId };
            for (const campo of campos) {
                medicion[campo] = document.getElementById(campo).value;
            }
            try {
                const datos = await pedir('api/mediciones', 'POST', medicion);
                mostrarMensaje('mensaje', datos.mensaje, 'success');
                document.getElementById('formMedicion').reset();
                cargarMediciones();
            } catch (error) {
                mostrarMensaje('mensaje', error.message, 'danger');
            }
        });

        verificarSesion('VENDEDOR').then(function (sesion) {
            if (sesion) {
                cargarClientes();
                cargarMediciones();
            }
        });
    </script>
</body>
</html>
