<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Óptica | Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 520px">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">Sistema de Óptica/PAVII</h2>
            <form id="formLogin">
                <label class="form-label" for="usuario">Correo / usuario</label>
                <input class="form-control mb-3" id="usuario" type="text" required>
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control mb-3" id="password" type="password" required>
                <button class="btn btn-primary w-100" id="btnEntrar">Entrar</button>
            </form>
            <div id="mensaje" class="d-none"></div>
            <hr>
            <h5>Crear cuenta de cliente</h5>
            <form id="formRegistro">
                <input class="form-control mb-2" id="nombre" placeholder="Nombre completo" required>
                <input class="form-control mb-2" id="dni" placeholder="DNI" required>
                <input class="form-control mb-2" id="telefono" placeholder="Teléfono">
                <input class="form-control mb-2" id="correo" type="email" placeholder="Correo" required>
                <input class="form-control mb-2" id="clave" type="password" minlength="8" placeholder="Contraseña (mínimo 8 caracteres)" required>
                <button class="btn btn-outline-success w-100">Registrarme</button>
            </form>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('formLogin').addEventListener('submit', async function (e) {
            e.preventDefault();
            const boton = document.getElementById('btnEntrar');
            boton.disabled = true;
            boton.textContent = 'Conectando...';
            try {
                const datos = await pedir('api/login', 'POST', {
                    usuario: document.getElementById('usuario').value,
                    password: document.getElementById('password').value
                });
                location.href = datos.destino;
            } catch (error) {
                mostrarMensaje('mensaje', error.message, 'danger');
            }
            boton.disabled = false;
            boton.textContent = 'Entrar';
        });

        document.getElementById('formRegistro').addEventListener('submit', async function (e) {
            e.preventDefault();
            try {
                const datos = await pedir('api/registro', 'POST', {
                    nombre: document.getElementById('nombre').value,
                    dni: document.getElementById('dni').value,
                    telefono: document.getElementById('telefono').value,
                    correo: document.getElementById('correo').value,
                    password: document.getElementById('clave').value
                });
                mostrarMensaje('mensaje', datos.mensaje, 'success');
                document.getElementById('usuario').value = document.getElementById('correo').value;
                document.getElementById('formRegistro').reset();
            } catch (error) {
                mostrarMensaje('mensaje', error.message, 'danger');
            }
        });
    </script>
</body>
</html>
