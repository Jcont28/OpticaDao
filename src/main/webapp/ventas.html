<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ventas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4" style="max-width:800px"><h2>Registrar venta</h2><form id="f" class="card card-body"><label>Cliente</label><select id="cliente" class="form-select mb-2" required></select><label>Medición del cliente</label><select id="medicion" class="form-select mb-2" required></select><label>Aro</label><select id="aro" class="form-select mb-2" required></select><label>Luna / cristal</label><select id="luna" class="form-select mb-2" required></select><label>Cantidad</label><input id="cantidad" class="form-control mb-2" type="number" min="1" value="1" required><label>Impuesto (porcentaje; 0 si no aplica)</label><input id="impuesto" class="form-control mb-3" type="number" min="0" step=".01" value="0"><button class="btn btn-primary">Procesar venta</button></form><p id="msg" class="mt-3"></p></main><script>
const $=x=>document.getElementById(x);async function opciones(tipo,extra=''){let r=await fetch('api/opciones?tipo='+tipo+extra);return r.json()}async function llenar(id,a){$(id).innerHTML='<option value="">Seleccione</option>'+a.map(x=>`<option value="${x.id}">${x.nombre}</option>`).join('');}
(async()=>{await llenar('cliente',await opciones('clientes'));let ps=await (await fetch('api/productos')).json();await llenar('aro',ps.filter(x=>x.tipo==='ARO').map(x=>({id:x.id,nombre:x.nombre+' (stock '+x.stock+')'})));await llenar('luna',ps.filter(x=>x.tipo==='LUNA').map(x=>({id:x.id,nombre:x.nombre+' (stock '+x.stock+')'})));})();
$('cliente').onchange=async()=>llenar('medicion',await opciones('mediciones','&clienteId='+$('cliente').value));
$('f').onsubmit=async e=>{e.preventDefault();let vend=await opciones('vendedor');if(!vend.length){msg.textContent='No hay vendedor asociado a esta sesión.';return;}let r=await fetch('api/ventas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clienteId:+cliente.value,medicionId:+medicion.value,aroId:+aro.value,lunaId:+luna.value,vendedorId:vend[0].id,cantidad:+cantidad.value,impuesto:+impuesto.value/100})});let d=await r.json();msg.textContent=d.mensaje;};
</script></body></html>
