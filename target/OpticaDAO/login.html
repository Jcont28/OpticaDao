<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Óptica | Acceso</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:520px"><div class="card shadow p-4"><h2 class="text-center mb-4">Óptica – Iniciar sesión</h2><form id="login"><label class="form-label">Correo / usuario</label><input class="form-control mb-3" id="usuario" type="text" required><label class="form-label">Contraseña</label><input class="form-control mb-3" id="password" type="password" required><button class="btn btn-primary w-100">Entrar</button></form><div id="msg" class="mt-3"></div><hr><h5>Crear cuenta de cliente</h5><form id="registro"><input class="form-control mb-2" id="nombre" placeholder="Nombre completo" required><input class="form-control mb-2" id="dni" placeholder="DNI" required><input class="form-control mb-2" id="telefono" placeholder="Teléfono"><input class="form-control mb-2" id="correo" type="email" placeholder="Correo" required><input class="form-control mb-2" id="pass2" type="password" placeholder="Contraseña (mínimo 8 caracteres)" required><button class="btn btn-outline-success w-100">Registrarme</button></form></div></main>
<script>
login.onsubmit=async e=>{e.preventDefault();let r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:usuario.value,password:password.value})});let d=await r.json();if(r.ok)location.href=d.destino;else msg.textContent=d.mensaje;};
registro.onsubmit=async e=>{e.preventDefault();let r=await fetch('api/registro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:nombre.value,dni:dni.value,telefono:telefono.value,correo:correo.value,password:pass2.value})});let d=await r.json();msg.textContent=d.mensaje;};
</script></body></html>
