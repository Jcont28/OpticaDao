<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo de aros</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand">Óptica | Catálogo</span><a class="nav-link text-white" href="historial.html">Mis mediciones</a></div></nav><main class="container py-4"><h2>Catálogo de aros</h2><div class="row g-2 mb-3"><div class="col"><input id="marca" class="form-control" placeholder="Filtrar por marca"></div><div class="col"><input id="material" class="form-control" placeholder="Material"></div><div class="col"><input id="forma" class="form-control" placeholder="Forma"></div><div class="col"><button class="btn btn-primary" onclick="cargar()">Filtrar</button></div></div><div id="cards" class="row g-3"></div></main><script>
async function cargar(){let q=new URLSearchParams({tipo:'ARO',marca:marca.value,material:material.value,forma:forma.value});let r=await fetch('api/productos?'+q);let a=await r.json();cards.innerHTML='';a.forEach(x=>cards.insertAdjacentHTML('beforeend',`<div class="col-md-4"><div class="card h-100"><div class="card-body"><h5>${x.nombre}</h5><p>${x.marca||''} · ${x.material||''} · ${x.forma||''}</p><p>Precio: L. ${x.precio} | Disponibles: ${x.stock}</p><button class="btn btn-outline-primary" onclick="apartar(${x.id})">Apartar aro</button></div></div></div>`));}
async function apartar(id){let r=await fetch('api/apartados',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({aroId:id})});let d=await r.json();alert(d.mensaje);}cargar();
</script></body></html>
