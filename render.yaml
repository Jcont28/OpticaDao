services:
  - type: web
    name: opticadao
    runtime: docker
    plan: free
    healthCheckPath: /login.html
    envVars:
      - key: PORT
        value: "8080"
      - key: OPTICA_DB_URL
        sync: false
      - key: OPTICA_DB_USER
        sync: false
      - key: OPTICA_DB_PASSWORD
        sync: false
